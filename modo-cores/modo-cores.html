<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Cores Profissional- Aprendendo HTML e CSS</title>

    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="css/global.css">

</head>
<body>
    
    <!-- SEÇÃO 1 : MODELO RGB (Baseado em luz : Red, Green, Blue) -->
    <section id="rgb" class="color-section">

        <!-- Divisão 1 de 7: Menu Lateral -->
        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo RGB</h2>
            <nav class="color-section__menu">

                <a href="#rgb" class="color-section__link color-section__link--active">RGB</a>
                <a href="#cmyk" class="color-section__link ">CMYK</a>
                <a href="#netflix" class="color-section__link ">Netflix</a>
                <a href="#google" class="color-section__link ">Google</a>
            </nav>
        </aside>

        <div class="color-section__bar color-section__bar--rgb-1"></div>

        <div class="color-section__bar color-section__bar--rgb-2"></div>

        <div class="color-section__bar color-section__bar--rgb-3"></div>

        <div class="color-section__bar color-section__bar--rgb-4"></div>

        <div class="color-section__bar color-section__bar--rgb-5"></div>

        <div class="color-section__bar color-section__bar--rgb-6"></div>


    </section>

    
    <!-- SEÇÃO 2 : MODELO CMYK (Baseado em Pigmento/Impressão) -->
    <section id="cmyk" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo CMYK</h2>
            <nav class="color-section__menu">

        <div class="color-section__bar color-section__bar--cmyk-3"></div>

        <div class="color-section__bar color-section__bar--cmyk-4"></div>

        <div class="color-section__bar color-section__bar--cmyk-5"></div>

        <div class="color-section__bar color-section__bar--cmyk-6"></div>

    </section> 

    <!-- SEÇÃO 3 : MODELO NETFLIX  -->
    <section id="netflix" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo Netflix</h2>
            <nav class="color-section__menu">

                <a href="#rgb" class="color-section__link ">RGB</a>

        <div class="color-section__bar color-section__bar--netflix-2"></div>

        <div class="color-section__bar color-section__bar--netflix-3"></div>


    </section> 

     <!-- SEÇÃO 4 : MODELO GOOGLE  -->
    <section id="google" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo Google</h2>
            <nav class="color-section__menu">

                <a href="#rgb" class="color-section__link ">RGB</a>
