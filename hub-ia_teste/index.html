<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de @media</title>

    <link rel="stylesheet" href="./css/reset.css">

    <style>
        body {
            padding: 20px;
            background-color: palevioletred;
            color: black;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: pink;
        }

        .container-position {
            width: 100%;
            height: 600px;
            border: 2px solid rgb(161, 52, 120);
            overflow: hidden;
            position: relative;

        }

        .filho-tamanho {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: pink;

        }

        .filho01__container-position {
            top: 0;
            left: 0;

        }

        .filho02__container-position {
            top: 0;
            right: 0;
        }

        .filho03__container-position {
            bottom: 0;
            left: 0;
        }

        .filho04__container-position {
            bottom: 0;
            right: 0;
        }

        .whats {
            width: 75px;
            height: 75px;
            background-color: rgb(10, 163, 99);
            border-radius: 50%;
            border: 5px solid #ffff;

            position: fixed;
            bottom: 100px;
            right: 60px;
            
        }

        .whats img{
            width: 65px;
            height: 65px;
        }

        @media (min-width: 768px) {
            body {
                background-color: rgb(233, 145, 182);
                color: azure;
            }

            .box {
                width: 45%;
                max-width: 600px;
            }

            @media (min-width: 992px) {
                body {
                    background-color: rgb(247, 157, 206);
                    color: black;
                }
            }

            .box {
                width: 300px;
            }
        }
    </style>

</head>


<body>
    <h1> Este é um teste de @media.</h1>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">

        <div class="filho01__container-position filho-tamanho"></div>
        <div class="filho02__container-position filho-tamanho"></div>
        <div class="filho03__container-position filho-tamanho"></div>
        <div class="filho04__container-position filho-tamanho"></div>
    </div>

    
        <div class="whats"><img src="./img/logo2.png" alt="logo do whats">
        </div>
</body>

</html>
